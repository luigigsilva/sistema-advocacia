<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Casos - JURISYNC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-container painel-casos">

    <!-- Cabeçalho do Painel -->
    <div class="painel-header">
        <h1>Painel de Casos</h1>
        <div class="header-acoes">
            <button class="btn-novo-caso" onclick="abrirModalNovo()">+ Novo Caso</button>
            <a href="/logout" class="btn-sair">Sair</a>
        </div>
    </div>

    <!-- Campo de Filtro/Pesquisa -->
    <div class="barra-ferramentas">
        <input type="text" id="pesquisaCaso" class="input-pesquisa" placeholder="Pesquisar por nº de processo ou tipo..." onkeyup="filtrarTabela()">
    </div>

    <!-- Tabela Principal de Casos -->
    <table class="container-tabela" id="tabelaCasos">
        <thead>
            <tr>
                <th>Nº Processo/Protocolo</th>
                <th>Tipo</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
            <!-- Linhas injetadas via JavaScript -->
        </tbody>
    </table>

</div>

<!-- Modal: Novo/Editar Caso -->
<div id="modal-caso" class="modal">
    <div class="modal-content">
        <button type="button" class="btn-fechar-modal" onclick="fecharModal()">&times;</button>
        <h2 id="titulo-modal">Novo Caso</h2>
        <div id="modal-erro"></div>
        <form id="form-caso">
            <input type="hidden" id="casoId" name="casoId">

            <div class="input-group">
                <label for="tipo">Tipo de Perícia *</label>
                <select id="tipo" name="tipo" required>
                    <option value="">Selecione...</option>
                    <option value="Judicial">Judicial</option>
                    <option value="Administrativa">Administrativa</option>
                </select>
            </div>

            <div class="input-group">
                <label for="processo">Nº do Processo/Protocolo *</label>
                <input type="text" id="processo" name="processo" required placeholder="Ex: 0000000-00.0000.0.00.0000" maxlength="25">
            </div>

            <div class="input-group">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" rows="2" placeholder="Detalhes breves..."></textarea>
            </div>

            <div class="input-group">
                <label for="dataAbertura">Data de Abertura *</label>
                <input type="date" id="dataAbertura" name="dataAbertura" required>
            </div>

            <div class="input-group">
                <button type="submit" id="btn-salvar" class="btn-entrar">Concluir</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Controle de Prazos (RF009, RF018, RN009, RN014) -->
<div id="modal-prazos" class="modal">
    <div class="modal-content modal-prazos-content">
        <button type="button" class="btn-fechar-modal" onclick="fecharModalPrazos()">&times;</button>
        <h2 id="titulo-modal-prazos">Prazos do Processo</h2>
        
        <div id="modal-prazo-erro"></div>

        <form id="form-prazo" class="form-prazos-container">
            <!-- Inputs Ocultos -->
            <input type="hidden" id="casoIdParaPrazo">
            <input type="hidden" id="prazoId">

            <div class="input-group">
                <label for="descPrazo">Descrição da Atividade *</label>
                <input type="text" id="descPrazo" required placeholder="Ex: Apresentar defesa prévia">
            </div>

            <div class="form-row">
                <div class="input-group form-col">
                    <label for="diasPrazo">Prazo (em Dias)</label>
                    <input type="number" id="diasPrazo" min="1" placeholder="Ex: 15">
                </div>

                <div class="input-group form-col">
                    <label for="tipoContagem">Contagem *</label>
                    <select id="tipoContagem" required>
                        <option value="DIAS_UTEIS">Dias Úteis</option>
                        <option value="DIAS_CORRIDOS">Dias Corridos</option>
                    </select>
                </div>

                <div class="input-group form-col">
                    <label for="dataVencimento">Vencimento *</label>
                    <input type="date" id="dataVencimento" required>
                </div>
            </div>

            <div class="input-group">
                <button type="submit" id="btn-salvar-prazo" class="btn-entrar btn-adicionar-prazo">Cadastrar Prazo</button>
            </div>
        </form>

        <h3 class="subtitulo-secao">Prazos Cadastrados</h3>
        <table class="container-tabela tabela-prazos">
            <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Vencimento</th>
                    <th>Contagem</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo-prazos">
                <!-- Linhas injetadas via JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script src="casos.js"></script>

</body>
</html>
