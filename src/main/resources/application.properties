spring.application.name=Advocacia

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/advocacia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# EMAIL ABAIXO: ESTÁ CONFIGURADO PARA USO LOCAL. TESTAR USANDO MAILTRAP
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:colocar_email}
spring.mail.password=${SPRING_MAIL_PASSWORD:colocar_senha}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.base-url=${APP_BASE_URL:http://localhost:8080}
# MUDAR O "app.base-url" PARA O SERVIDOR HOSPEDADO. MUDAR TAMBÉM O HOST, PORT E ETC. (DEPENDE DO SERVIDOR)